<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Quién es este Pokémon?</title>
<!-- Favicon de Pokébola -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23ff3b30' stroke='%231b2742' stroke-width='4'/><path d='M 2 32 h 60' stroke='%231b2742' stroke-width='4'/><path d='M 2 32 a 30 30 0 0 0 60 0 Z' fill='%23f8f9fa'/><circle cx='32' cy='32' r='30' fill='none' stroke='%231b2742' stroke-width='4'/><circle cx='32' cy='32' r='10' fill='%23f8f9fa' stroke='%231b2742' stroke-width='4'/><circle cx='32' cy='32' r='4' fill='%231b2742'/></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Pantalla de Inicio Minimalista y Directa -->
<div id="startScreen" class="anime-start-screen">
  <div class="anime-sunburst"></div>
  <div class="anime-start-content">
    <h1 class="anime-main-title">¿Quién es<br>ese Pokémon?</h1>
    <button id="startGameBtn" class="anime-btn-start">Comenzar Partida</button>
  </div>
</div>

<!-- Interfaz Principal (Pantalla completa width y height) -->
<div class="app-fullscreen">
  
  <!-- Cabecera Superior: Cronómetro, Título Dinámico y Ajustes -->
  <header class="anime-header">
    <div class="anime-pill">TIEMPO: <b id="gameTimer">0:00</b></div>
    <div class="anime-title-container">
      <h2 id="mainTitle" class="anime-header-title">¿Quién es ese Pokémon?</h2>
    </div>
    <div class="anime-header-actions">
      <button id="settingsBtn" class="anime-btn-icon" title="Ajustes y Audio">⚙️</button>
      <button id="themeToggle" class="anime-btn-icon" title="Modo Oscuro / Claro">🌙</button>
    </div>
  </header>

  <!-- Contenido Central Dinámico (Juego / Resumen Final) -->
  <main class="anime-main-content">
    
    <!-- Zona de Juego Activa -->
    <div id="gamePlayArea" class="game-play-grid">
      
      <!-- Columna Izquierda: Imagen y Ayuda -->
      <div class="col-left-tv">
        <div class="anime-stats-row">
          <div class="anime-pill">PUNTOS: <b id="score">0</b></div>
          <div class="anime-pill">RONDA: <b id="round">1</b>/<b id="total">10</b></div>
        </div>
        
        <div class="tv-stage">
          <div class="imgBox">
            <img id="pokeBase" class="pokeBase" src="" alt="Pokémon a color">
            <img id="pokeMask" class="pokeMask" src="" alt="Silueta negra">
          </div>
          <button id="hint" class="anime-btn-action" style="margin-top:12px;">Revelar Sector</button>
          <div id="extra" class="extra"></div>
        </div>
      </div>

      <!-- Columna Derecha: Opciones y Controles -->
      <div class="col-right-tv">
        <div class="tv-question-box">
          <div class="question">Selecciona el nombre correcto:</div>
          <div id="answers" class="ans"></div>
        </div>

        <div class="controls">
          <span id="status" class="muted"></span>
          <button id="next" class="anime-btn-action" disabled>Siguiente</button>
        </div>
      </div>

    </div>

    <!-- Pantalla de Resumen Final de Ronda (Oculta al inicio) -->
    <div id="summaryArea" class="summary-container" style="display:none;">
      <div class="summary-card">
        <h2 id="summaryRankTitle" class="summary-rank-heading">Partida Finalizada</h2>
        <p class="summary-sub">Registro de los Pokémon de la partida:</p>
        
        <!-- Contenedor con scroll para los pokemones adivinados / fallados -->
        <div id="summaryPokemonList" class="pokemon-summary-grid"></div>
        
        <button id="restartGameBtn" class="anime-btn-start" style="margin-top:16px;">Jugar Otra Vez</button>
      </div>
    </div>

  </main>

  <!-- Panel Lateral / Inferior de Ranking Estilizado -->
  <footer class="anime-footer-ranking">
    <div id="ranking"></div>
  </footer>

</div>

<!-- Modal de Ajustes -->
<div id="settingsModal" class="modal">
  <div class="modal-content">
    <h2>⚙️ Ajustes del Juego</h2>
    
    <div class="modal-section">
      <div class="audio-title">🎵 Ajustes de Audio</div>
      <div class="audio-controls-grid">
        <div class="audio-control-item">
          <label for="musicVol">Música de Fondo</label>
          <div class="audio-input-row">
            <input type="range" id="musicVol" min="0" max="1" step="0.05" value="0.3">
            <button id="musicToggle" class="btnSm" style="padding:4px 10px; font-size:11px; white-space:nowrap;">▶️ Play</button>
          </div>
        </div>
        <div class="audio-control-item">
          <label for="sfxVol">Efectos (SFX)</label>
          <div class="audio-input-row">
            <input type="range" id="sfxVol" min="0" max="1" step="0.05" value="0.7" style="width:100%;">
          </div>
        </div>
      </div>
    </div>

    <div class="modal-section" id="adminSection" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <span class="muted" style="font-size:12px; font-weight:700;">Panel de Administrador (Ranking):</span>
        <button id="lockAdminBtn" class="btnSm" style="padding:2px 6px; font-size:10px;">🔒 Bloquear</button>
      </div>
      <div id="adminRankingList" style="max-height:130px; overflow-y:auto; margin-bottom:8px; border:1px solid var(--border); border-radius:8px; padding:4px;"></div>
      <button id="resetRankingBtn" class="btnSm" style="background:#ef4444; color:#fff; border:none; width:100%;">🗑️ Resetear Todo el Ranking</button>
    </div>

    <div style="display:flex; gap:10px; justify-content:space-between; margin-top: 12px;">
      <button id="openAdminPassBtn" class="btnSm" style="font-size:11px;">🔐 Modo Admin</button>
      <button id="closeSettingsBtn" class="btnSm">Cerrar</button>
    </div>
  </div>
</div>

<audio id="bgMusic" loop preload="auto" src="batalla-pokemon.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
